services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: host.docker.internal
      DB_PORT: ${DB_PORT:-3306}
    ports:
      - "8000:80"
    command: ["sh", "-c", "php artisan migrate --seed --force && apache2-foreground"]
