services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-horus}
      DB_USERNAME: ${DB_USERNAME:-horus}
      DB_PASSWORD: ${DB_PASSWORD:-horus_local_change}
    ports:
      - "8000:80"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-horus}
      MARIADB_USER: ${DB_USERNAME:-horus}
      MARIADB_PASSWORD: ${DB_PASSWORD:-horus_local_change}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-horus_root_local_change}
    ports:
      - "3307:3306"
    volumes:
      - horus_mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5-apache
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  horus_mariadb:
